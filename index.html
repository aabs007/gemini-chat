<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Gemini Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  :root {
    --bg: #fbfbfd;
    --bg-alt: #f5f5f7;
    --panel: #ffffff;
    --glass: rgba(251, 251, 253, 0.72);
    --text: #1d1d1f;
    --muted: #86868b;
    --hairline: rgba(0, 0, 0, 0.08);
    --accent: #0071e3;
    --accent-hover: #0077ed;
    --on-accent: #ffffff;
    --code-bg: #f5f5f7;
    --danger: #e30000;
    --shadow: 0 2px 6px rgba(0,0,0,.04), 0 12px 32px rgba(0,0,0,.08);
    --shadow-lg: 0 4px 12px rgba(0,0,0,.06), 0 24px 60px rgba(0,0,0,.14);
    --grad: linear-gradient(100deg, #2f6bff 0%, #8b5cf6 45%, #e6488a 80%, #ff8a3d 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-alt: #0d0d0f;
      --panel: #1d1d1f;
      --glass: rgba(22, 22, 23, 0.72);
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --hairline: rgba(255, 255, 255, 0.12);
      --accent: #2997ff;
      --accent-hover: #47a6ff;
      --on-accent: #ffffff;
      --code-bg: #1d1d1f;
      --danger: #ff453a;
      --shadow: 0 2px 6px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.5);
      --shadow-lg: 0 4px 12px rgba(0,0,0,.4), 0 24px 60px rgba(0,0,0,.6);
      --grad: linear-gradient(100deg, #5b8cff 0%, #a78bfa 45%, #f472b6 80%, #ffa45c 100%);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", sans-serif;
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.022em;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button, select, textarea, input { font: inherit; color: inherit; letter-spacing: inherit; }

  /* ---------- Glass nav ---------- */
  header {
    position: absolute; inset: 0 0 auto 0; z-index: 10;
    height: 52px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 max(16px, env(safe-area-inset-left));
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--hairline);
  }
  .brand {
    margin-right: auto;
    display: flex; align-items: center; gap: 8px;
    font-weight: 600; font-size: 17px; letter-spacing: -0.01em;
  }
  .brand .spark {
    width: 22px; height: 22px; border-radius: 7px;
    background: var(--grad);
    display: grid; place-items: center;
    color: #fff; font-size: 13px;
  }
  .select-wrap { position: relative; }
  .select-wrap::after {
    content: ""; position: absolute; right: 12px; top: 50%;
    width: 6px; height: 6px; margin-top: -5px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg); pointer-events: none;
  }
  select {
    appearance: none; -webkit-appearance: none;
    background: var(--bg-alt);
    border: 1px solid var(--hairline);
    border-radius: 980px;
    padding: 6px 30px 6px 14px;
    font-size: 14px;
    max-width: 210px;
    cursor: pointer;
    transition: border-color .2s;
  }
  select:hover { border-color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent;
    border: none;
    border-radius: 980px;
    padding: 6px 12px;
    font-size: 14px;
    color: var(--accent);
    cursor: pointer;
    transition: background .2s;
  }
  .pill:hover { background: var(--bg-alt); }
  .pill svg { width: 16px; height: 16px; }

  /* ---------- Conversation ---------- */
  main {
    flex: 1; overflow-y: auto;
    padding-top: 52px;
    scroll-behavior: smooth;
  }
  #messages {
    max-width: 760px; margin: 0 auto;
    padding: 40px 20px 180px;
  }

  .hero { text-align: center; padding: 11vh 0 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .eyebrow {
    font-size: 14px; font-weight: 600; letter-spacing: 0;
    color: var(--muted); text-transform: none; margin-bottom: 10px;
  }
  .hero h2 {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, sans-serif;
    font-size: clamp(40px, 8vw, 72px);
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.045em;
    margin: 0 0 14px;
  }
  .hero h2 .grad {
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .hero p {
    font-size: clamp(19px, 2.6vw, 24px);
    line-height: 1.35;
    color: var(--muted);
    font-weight: 500;
    max-width: 560px;
    margin: 0 auto 40px;
  }
  .hero .cta {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--on-accent);
    border: none; border-radius: 980px;
    padding: 12px 22px; font-size: 17px; cursor: pointer;
    transition: background .2s, transform .2s;
  }
  .hero .cta:hover { background: var(--accent-hover); }
  .hero .cta:active { transform: scale(.97); }

  .cards {
    display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    text-align: left;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 16px 18px;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
    animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .card:nth-child(2) { animation-delay: .06s; }
  .card:nth-child(3) { animation-delay: .12s; }
  .card:nth-child(4) { animation-delay: .18s; }
  .card:hover { transform: translateY(-3px) scale(1.01); box-shadow: var(--shadow); }
  .card .ic { font-size: 22px; margin-bottom: 8px; }
  .card b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .card span { font-size: 14px; color: var(--muted); line-height: 1.35; }

  .msg { margin-bottom: 26px; display: flex; animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 100%; overflow-wrap: anywhere; }
  .msg.user .bubble {
    background: var(--accent);
    color: var(--on-accent);
    padding: 10px 16px;
    border-radius: 20px 20px 6px 20px;
    max-width: 80%;
    white-space: pre-wrap;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .msg.model { gap: 14px; }
  .msg.model::before {
    content: "✦"; flex: none;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--grad); color: #fff;
    display: grid; place-items: center; font-size: 14px;
    margin-top: 2px;
  }
  .msg.model .bubble { flex: 1; min-width: 0; }
  .msg.model .bubble > :first-child { margin-top: 3px; }
  .msg.model .bubble > :last-child { margin-bottom: 0; }
  .msg.error .bubble { color: var(--danger); }
  .bubble img.thumb { max-width: 200px; max-height: 200px; border-radius: 14px; display: block; margin: 2px 0 8px; }
  .bubble h1, .bubble h2, .bubble h3 { letter-spacing: -0.03em; line-height: 1.2; margin: 1.2em 0 .5em; }
  .bubble a { color: var(--accent); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .bubble blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--hairline); color: var(--muted); }

  pre {
    background: var(--code-bg);
    border: 1px solid var(--hairline);
    padding: 16px;
    border-radius: 14px;
    overflow-x: auto;
    position: relative;
    letter-spacing: 0;
  }
  code { font-family: "SF Mono", "JetBrains Mono", ui-monospace, monospace; font-size: 13.5px; }
  :not(pre) > code { background: var(--code-bg); padding: 2px 6px; border-radius: 6px; }
  .copy {
    position: absolute; top: 8px; right: 8px;
    font-size: 12px; padding: 4px 10px;
    background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--hairline); border-radius: 980px; cursor: pointer;
    opacity: 0; transition: opacity .2s;
  }
  pre:hover .copy, .copy:focus { opacity: 1; }
  @media (hover: none) { .copy { opacity: 1; } }
  table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 15px; }
  th, td { border-bottom: 1px solid var(--hairline); padding: 8px 12px; text-align: left; }
  th { font-weight: 600; }

  .typing { display: inline-flex; gap: 5px; padding: 8px 0; }
  .typing i {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: dot 1.2s infinite ease-in-out;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- Floating composer ---------- */
  footer {
    position: absolute; inset: auto 0 0 0; z-index: 10;
    padding: 24px 16px max(14px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 55%, transparent);
    pointer-events: none;
  }
  .composer {
    pointer-events: auto;
    max-width: 760px; margin: 0 auto;
    background: var(--glass);
    backdrop-filter: saturate(180%) blur(24px);
    -webkit-backdrop-filter: saturate(180%) blur(24px);
    border: 1px solid var(--hairline);
    border-radius: 28px;
    padding: 8px;
    box-shadow: var(--shadow);
    transition: box-shadow .3s, border-color .3s;
  }
  .composer:focus-within { box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  #attachments { display: flex; gap: 8px; flex-wrap: wrap; }
  #attachments:not(:empty) { padding: 6px 6px 10px; }
  .att { position: relative; animation: rise .3s both; }
  .att img { width: 60px; height: 60px; object-fit: cover; border-radius: 12px; display: block; }
  .att button {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px;
    border-radius: 50%; border: 2px solid var(--panel); background: var(--text); color: var(--bg);
    font-size: 11px; line-height: 18px; cursor: pointer; padding: 0;
  }
  .row { display: flex; align-items: flex-end; gap: 4px; }
  textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent;
    padding: 8px 6px; max-height: 200px; line-height: 1.4;
  }
  textarea::placeholder { color: var(--muted); }
  .round {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    border: none; cursor: pointer;
    transition: background .2s, transform .15s, opacity .2s;
  }
  .round:active { transform: scale(.92); }
  .round svg { width: 18px; height: 18px; }
  #attachBtn { background: transparent; color: var(--muted); }
  #attachBtn:hover { background: var(--bg-alt); color: var(--text); }
  #send { background: var(--accent); color: var(--on-accent); }
  #send:hover { background: var(--accent-hover); }
  #send:disabled { opacity: .3; cursor: default; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; letter-spacing: 0; }

  /* ---------- Settings sheet ---------- */
  dialog {
    border: 1px solid var(--hairline); border-radius: 24px;
    background: var(--panel); color: var(--text);
    width: min(460px, calc(100vw - 32px)); padding: 28px;
    box-shadow: var(--shadow-lg);
  }
  dialog[open] { animation: pop .35s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  dialog::backdrop { background: rgba(0,0,0,.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  dialog h2 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.03em; }
  dialog .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
  dialog label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  dialog label span { color: var(--muted); font-weight: 500; }
  dialog input[type=password], dialog textarea {
    width: 100%; background: var(--bg-alt); border: 1px solid transparent;
    border-radius: 12px; padding: 11px 14px; outline: none; font-size: 15px;
    transition: border-color .2s, box-shadow .2s;
  }
  dialog input[type=password]:focus, dialog textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent);
  }
  dialog textarea { min-height: 84px; resize: vertical; }
  dialog small { color: var(--muted); display: block; margin-top: 6px; font-size: 13px; line-height: 1.4; letter-spacing: 0; }
  dialog a { color: var(--accent); text-decoration: none; }
  dialog a:hover { text-decoration: underline; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }
  .btn {
    border-radius: 980px; padding: 9px 20px; font-size: 15px; cursor: pointer;
    border: none; background: var(--bg-alt); transition: background .2s, transform .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:hover { background: var(--accent-hover); }

  @media (max-width: 560px) {
    select { max-width: 140px; font-size: 13px; }
    .pill .label { display: none; }
    #messages { padding-top: 24px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="spark">✦</span> Gemini</div>
  <div class="select-wrap"><select id="model" title="Model"></select></div>
  <button class="pill" id="newChat" title="New chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="label">New</span>
  </button>
  <button class="pill" id="openSettings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="scroller">
  <div id="messages"></div>
</main>

<footer>
  <div class="composer">
    <div id="attachments"></div>
    <div class="row">
      <button class="round" id="attachBtn" title="Attach image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <textarea id="input" rows="1" placeholder="Ask Gemini anything"></textarea>
      <button class="round" id="send" title="Send"></button>
    </div>
  </div>
  <div class="hint">Return to send · Shift + Return for a new line</div>
</footer>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <p class="sub">Everything here stays on this device.</p>
    <label for="apiKey">Gemini API key</label>
    <input id="apiKey" type="password" placeholder="AIza…" autocomplete="off">
    <small>Get a free key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>. It's saved only in this browser and sent only to Google.</small>
    <label for="systemPrompt">System instructions <span>Optional</span></label>
    <textarea id="systemPrompt" placeholder="e.g. You are a concise, friendly assistant."></textarea>
    <label for="temperature">Creativity <span id="tempVal"></span></label>
    <input id="temperature" type="range" min="0" max="2" step="0.1">
    <div class="actions">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" value="save">Save</button>
    </div>
  </form>
</dialog>

<script>
const API = "https://generativelanguage.googleapis.com/v1beta";
const FALLBACK_MODELS = ["gemini-2.5-pro", "gemini-2.5-flash", "gemini-2.5-flash-lite"];
const FALLBACK_GEMMA = ["gemma-3-27b-it", "gemma-3-12b-it", "gemma-3-4b-it"];
const ICON_SEND = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>`;
const ICON_STOP = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>`;
const SUGGESTIONS = [
  { ic: "💡", t: "Explain", d: "how black holes form, simply", p: "Explain how black holes form, in simple terms." },
  { ic: "✍️", t: "Write", d: "a short poem about the sea", p: "Write a short poem about the sea." },
  { ic: "🧑‍💻", t: "Code", d: "a to-do app in plain JavaScript", p: "Write a minimal to-do list app in plain HTML and JavaScript." },
  { ic: "🗺️", t: "Plan", d: "a 3-day trip to Tokyo", p: "Plan a 3-day trip to Tokyo for a first-time visitor." },
];

const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let settings = store.get("gc.settings", { apiKey: "", systemPrompt: "", temperature: 1, model: "" });
let history = store.get("gc.history", []);   // [{role:'user'|'model', parts:[...]}]
let pending = [];                             // images waiting to send
let controller = null;

marked.setOptions({ breaks: true, gfm: true });
const render = (md) => DOMPurify.sanitize(marked.parse(md || ""));
const esc = (s) => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- Models ---------- */
async function loadModels() {
  const sel = $("model");
  let names = FALLBACK_MODELS, gemma = FALLBACK_GEMMA;
  if (settings.apiKey) {
    try {
      const r = await fetch(`${API}/models?pageSize=200`, { headers: { "x-goog-api-key": settings.apiKey } });
      if (r.ok) {
        const data = await r.json();
        const list = (data.models || [])
          .filter(m => m.supportedGenerationMethods?.includes("generateContent"))
          .map(m => m.name.replace("models/", ""))
          .filter(n => !/embedding|tts|image-generation|live|audio/.test(n));
        const latest = latestOnly(list.filter(n => n.startsWith("gemini")));
        if (latest.length) names = latest;
        gemma = latestGemma(list.filter(n => n.startsWith("gemma")));
      }
    } catch {}
  }
  const opts = (arr) => arr.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  sel.innerHTML = `<optgroup label="Gemini">${opts(names)}</optgroup>`
    + (gemma.length ? `<optgroup label="Gemma · open models">${opts(gemma)}</optgroup>` : "");
  const all = [...names, ...gemma];
  const preferred = settings.model && all.includes(settings.model)
    ? settings.model
    : names.find(n => /flash$/.test(n)) || names[0];
  sel.value = preferred;
  settings.model = preferred;
}

// Newest Gemma generation only (e.g. gemma-3-*), biggest size first.
function latestGemma(list) {
  const parsed = list
    .map(name => { const m = name.match(/^gemma-(\d+)(n?)-e?(\d+)b-it$/); return m && { name, v: +m[1], n: m[2], size: +m[3] }; })
    .filter(Boolean);
  const top = Math.max(0, ...parsed.map(p => p.v));
  return parsed
    .filter(p => p.v === top)
    .sort((a, b) => a.n.localeCompare(b.n) || b.size - a.size)
    .map(p => p.name);
}
// Keep only the newest version of each model tier (Pro, Flash, Flash-Lite…),
// hiding older generations and dated snapshots like "-001" or "-05-20".
function latestOnly(list) {
  const newest = {};
  const parsed = [];
  for (const name of list) {
    const m = name.match(/^gemini-(\d+(?:\.\d+)?)-([a-z]+(?:-lite)?)(.*)$/);
    if (!m) continue;
    const [, ver, tier, rest] = m;
    if (/-\d{3}$|-\d{2}-\d{2}|\d{4}|exp/.test(rest)) continue;
    const v = parseFloat(ver);
    parsed.push({ name, tier, v, stable: rest === "" });
    newest[tier] = Math.max(newest[tier] ?? 0, v);
  }
  const order = { pro: 0, flash: 1, "flash-lite": 2 };
  return parsed
    .filter(p => p.v === newest[p.tier])
    .sort((a, b) => (order[a.tier] ?? 9) - (order[b.tier] ?? 9) || b.stable - a.stable || a.name.localeCompare(b.name))
    .map(p => p.name);
}
$("model").onchange =(e) => { settings.model = e.target.value; store.set("gc.settings", settings); };

/* ---------- Rendering ---------- */
function renderAll() {
  const box = $("messages");
  box.innerHTML = "";
  if (!history.length) { renderHero(); return; }
  for (const m of history) addBubble(m);
  scrollDown();
}

function renderHero() {
  const box = $("messages");
  const hasKey = !!settings.apiKey;
  box.innerHTML = `
    <section class="hero">
      <div class="eyebrow">Powered by Google Gemini</div>
      <h2>Ask anything.<br><span class="grad">Get brilliant answers.</span></h2>
      <p>${hasKey
        ? "Write, learn, plan and code, or drop in a photo and ask about it."
        : "Add your free Gemini API key to get started. It only takes a minute."}</p>
      ${hasKey
        ? `<div class="cards">${SUGGESTIONS.map((s, i) =>
            `<div class="card" data-i="${i}" role="button" tabindex="0"><div class="ic">${s.ic}</div><b>${s.t}</b><span>${s.d}</span></div>`).join("")}</div>`
        : `<button class="cta" id="heroSetup">Add API key <span aria-hidden="true">›</span></button>`}
    </section>`;
  box.querySelectorAll(".card").forEach(c => {
    const go = () => { $("input").value = SUGGESTIONS[c.dataset.i].p; autosize(); send(); };
    c.onclick = go;
    c.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
  $("heroSetup")?.addEventListener("click", openSettings);
}

function addBubble(m, extraClass = "") {
  const wrap = document.createElement("div");
  wrap.className = `msg ${m.role} ${extraClass}`;
  const b = document.createElement("div");
  b.className = "bubble";
  if (m.role === "user") {
    for (const p of m.parts) {
      if (p.inlineData) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = `data:${p.inlineData.mimeType};base64,${p.inlineData.data}`;
        b.appendChild(img);
      }
    }
    const text = m.parts.filter(p => p.text).map(p => p.text).join("\n");
    if (text) b.appendChild(document.createTextNode(text));
  } else {
    b.innerHTML = render(m.parts.map(p => p.text || "").join(""));
    decorateCode(b);
  }
  wrap.appendChild(b);
  $("messages").appendChild(wrap);
  return b;
}

function decorateCode(el) {
  el.querySelectorAll("pre").forEach(pre => {
    if (pre.querySelector(".copy")) return;
    const btn = document.createElement("button");
    btn.className = "copy";
    btn.textContent = "Copy";
    btn.onclick = () => {
      navigator.clipboard.writeText(pre.querySelector("code")?.innerText || pre.innerText);
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = "Copy"), 1200);
    };
    pre.appendChild(btn);
  });
}

function scrollDown() { const s = $("scroller"); s.scrollTo({ top: s.scrollHeight }); }
function nearBottom() { const s = $("scroller"); return s.scrollHeight - s.scrollTop - s.clientHeight < 120; }

/* ---------- Sending ---------- */
async function send() {
  if (controller) { controller.abort(); return; }
  const text = $("input").value.trim();
  if (!text && !pending.length) return;
  if (!settings.apiKey) { openSettings(); return; }

  const parts = [...pending.map(p => ({ inlineData: p })), ...(text ? [{ text }] : [])];
  const userMsg = { role: "user", parts };
  if (!history.length) $("messages").innerHTML = "";
  history.push(userMsg);
  addBubble(userMsg);
  $("input").value = ""; autosize();
  pending = []; renderAttachments();
  saveHistory();

  const bubble = addBubble({ role: "model", parts: [{ text: "" }] });
  bubble.innerHTML = `<span class="typing"><i></i><i></i><i></i></span>`;
  scrollDown();

  controller = new AbortController();
  setBusy(true);
  let reply = "";

  try {
    const body = {
      contents: history,
      generationConfig: { temperature: Number(settings.temperature) },
    };
    const sys = settings.systemPrompt.trim();
    if (sys && settings.model.startsWith("gemma")) {
      // Gemma doesn't accept system instructions, so fold them into the first message.
      const [first, ...rest] = history;
      body.contents = [{ role: "user", parts: [{ text: `Instructions: ${sys}` }, ...first.parts] }, ...rest];
    } else if (sys) {
      body.systemInstruction = { parts: [{ text: sys }] };
    }

    const res = await fetch(`${API}/models/${settings.model}:streamGenerateContent?alt=sse`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": settings.apiKey },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).error?.message || msg; } catch {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        try {
          const chunk = JSON.parse(line.slice(5));
          const cand = chunk.candidates?.[0];
          const t = (cand?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
          if (t) {
            reply += t;
            const stick = nearBottom();
            bubble.innerHTML = render(reply);
            if (stick) scrollDown();
          }
          if (chunk.promptFeedback?.blockReason) throw new Error(`Blocked: ${chunk.promptFeedback.blockReason}`);
        } catch (e) { if (e.message.startsWith("Blocked")) throw e; }
      }
    }
    if (!reply) reply = "_(No response)_";
  } catch (e) {
    if (e.name === "AbortError") {
      reply += reply ? "\n\n_(stopped)_" : "_(stopped)_";
    } else {
      bubble.parentElement.classList.add("error");
      bubble.textContent = e.message;
      history.pop();          // drop the failed user turn so the chat stays valid
      bubble.parentElement.previousElementSibling?.remove();
      $("input").value = text; autosize();
      saveHistory();
      controller = null; setBusy(false);
      return;
    }
  }

  bubble.innerHTML = render(reply);
  decorateCode(bubble);
  history.push({ role: "model", parts: [{ text: reply }] });
  saveHistory();
  controller = null;
  setBusy(false);
}

function setBusy(b) {
  $("send").innerHTML = b ? ICON_STOP : ICON_SEND;
  $("send").title = b ? "Stop" : "Send";
  updateSend();
}
function updateSend() {
  $("send").disabled = !controller && !$("input").value.trim() && !pending.length;
}

function saveHistory() {
  // Keep localStorage small: don't persist image data across reloads
  const slim = history.map(m => ({ role: m.role, parts: m.parts.map(p => p.inlineData ? { text: "[image]" } : p) }));
  store.set("gc.history", slim);
}

/* ---------- Attachments ---------- */
$("attachBtn").onclick = () => $("fileInput").click();
$("fileInput").onchange = async (e) => {
  for (const f of e.target.files) await addImage(f);
  e.target.value = "";
};
document.addEventListener("paste", async (e) => {
  for (const item of e.clipboardData?.items || []) {
    if (item.type.startsWith("image/")) await addImage(item.getAsFile());
  }
});
function addImage(file) {
  return new Promise((resolve) => {
    const r = new FileReader();
    r.onload = () => {
      const [, mimeType, data] = r.result.match(/^data:(.+?);base64,(.*)$/);
      pending.push({ mimeType, data });
      renderAttachments();
      resolve();
    };
    r.readAsDataURL(file);
  });
}
function renderAttachments() {
  const box = $("attachments");
  box.innerHTML = "";
  pending.forEach((p, i) => {
    const d = document.createElement("div");
    d.className = "att";
    d.innerHTML = `<img src="data:${p.mimeType};base64,${p.data}"><button title="Remove">✕</button>`;
    d.querySelector("button").onclick = () => { pending.splice(i, 1); renderAttachments(); };
    box.appendChild(d);
  });
  updateSend();
}

/* ---------- Input ---------- */
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; updateSend(); }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("send").onclick = send;
$("newChat").onclick = () => {
  if (controller) controller.abort();
  history = []; saveHistory(); renderAll(); $("input").focus();
};

/* ---------- Settings ---------- */
function openSettings() {
  $("apiKey").value = settings.apiKey;
  $("systemPrompt").value = settings.systemPrompt;
  $("temperature").value = settings.temperature;
  $("tempVal").textContent = settings.temperature;
  $("settings").showModal();
}
$("temperature").oninput = (e) => ($("tempVal").textContent = e.target.value);
$("openSettings").onclick = openSettings;
$("settings").addEventListener("close", async () => {
  if ($("settings").returnValue !== "save") return;
  const keyChanged = $("apiKey").value.trim() !== settings.apiKey;
  settings.apiKey = $("apiKey").value.trim();
  settings.systemPrompt = $("systemPrompt").value;
  settings.temperature = Number($("temperature").value);
  store.set("gc.settings", settings);
  if (keyChanged) await loadModels();
  renderAll();
});

/* ---------- Boot ---------- */
setBusy(false);
loadModels().then(() => { store.set("gc.settings", settings); renderAll(); });
</script>
</body>
</html>
